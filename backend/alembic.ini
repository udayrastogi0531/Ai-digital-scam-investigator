# Alembic configuration for the AI Digital Scam Investigator.
#
# The database URL is intentionally NOT set here: alembic/env.py reads it from
# the application settings (DATABASE_URL), which stays the single source of
# truth for both the app and migrations.
[alembic]
script_location = alembic
prepend_sys_path = .
# Use a monotonic, timestamp-free revision naming style?  Standard hashes are
# fine; keep defaults.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
